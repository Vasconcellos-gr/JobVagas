<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confira os detalhes de uma oportunidade na JOBVAGAS.">
  <title>Detalhes da vaga | JOBVAGAS</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="jobs-page vacancy-detail-page">
  <!-- Cabeçalho público; a vaga é identificada pelo parâmetro id da URL. -->
  <header class="site-header">
    <div class="jobs-container header-inner">
      <a class="brand" href="index.html" aria-label="JOBVAGAS - início">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span>JOBVAGAS</span>
      </a>
      <nav class="main-nav" aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a class="active" href="vagas.html" aria-current="page">Vagas</a>
      </nav>
      <div class="header-actions">
        <a class="link-muted" href="login.html">Entrar</a>
        <a class="btn btn-primary" href="cadastro.html">Cadastrar</a>
      </div>
    </div>
  </header>

  <main class="jobs-container vacancy-detail-main">
    <a class="registration-back" href="home_candidato.html">← Voltar para minha área</a>
    <!-- Exibe carregamento/erros até a API retornar a vaga solicitada. -->
    <p id="mensagemDetalheVaga" class="notice" role="status" aria-live="polite">Carregando detalhes da vaga...</p>
    <div id="conteudoDetalheVaga" class="vacancy-detail-layout" hidden>
      <!-- Informações da vaga e dados públicos da empresa são preenchidos via JavaScript. -->
      <article class="vacancy-detail-card" aria-labelledby="tituloDetalheVaga">
        <span class="eyebrow">OPORTUNIDADE</span>
        <h1 id="tituloDetalheVaga"></h1>
        <p id="empresaDetalheVaga" class="vacancy-detail-company"></p>
        <div id="metadadosDetalheVaga" class="job-meta vacancy-detail-meta"></div>
        <p id="salarioDetalheVaga" class="job-salary vacancy-detail-salary"></p>
        <section class="vacancy-description-section" aria-labelledby="descricaoTitulo">
          <h2 id="descricaoTitulo">Sobre a vaga</h2>
          <p id="descricaoDetalheVaga"></p>
        </section>
        <p id="dataDetalheVaga" class="vacancy-detail-date"></p>
      </article>

      <aside class="vacancy-company-card" aria-labelledby="empresaTitulo">
        <span class="eyebrow">EMPRESA</span>
        <h2 id="empresaTitulo"></h2>
        <dl id="informacoesEmpresa" class="vacancy-company-info"></dl>
      </aside>
    </div>
  </main>

</body>
</html>
